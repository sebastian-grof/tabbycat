services:
  postgres:
    image: postgres:17
    container_name: tabbycat-postgres
    restart: always
    environment:
      POSTGRES_USER: tabbycat
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: tabbycat
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabbycat -d tabbycat"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: tabbycat-redis
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: tabbycat-web
    working_dir: /tcd
    command: ["./bin/docker-run-honcho.sh"]
    environment:
      - IN_DOCKER=1
      - DEBUG=0
      - USING_NGINX=1
      - DATABASE_URL=postgresql://tabbycat:${DATABASE_PASSWORD}@postgres:5432/tabbycat
      - REDIS_URL=redis://redis:6379
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - TIME_ZONE=${TIME_ZONE}
      - TAB_DIRECTOR_EMAIL=${TAB_DIRECTOR_EMAIL}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      # SDA judges export integration (fork-specific)
      - SDA_JUDGES_FEEDBACK_EXPORT_ENABLED=${SDA_JUDGES_FEEDBACK_EXPORT_ENABLED}
      - SDA_JUDGES_FEEDBACK_API_URL=${SDA_JUDGES_FEEDBACK_API_URL}
      - SDA_JUDGES_FEEDBACK_API_TOKEN=${SDA_JUDGES_FEEDBACK_API_TOKEN}
      - SDA_JUDGES_ACTIVITY_EXPORT_ENABLED=${SDA_JUDGES_ACTIVITY_EXPORT_ENABLED}
      - SDA_JUDGES_ACTIVITY_API_URL=${SDA_JUDGES_ACTIVITY_API_URL}
    expose:
      - "8000"
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: tabbycat-worker
    working_dir: /tcd
    command: ["./bin/docker-wait.sh", "--timeout=0", "web:8000", "--", "./bin/docker-run-worker.sh"]
    environment:
      - IN_DOCKER=1
      - DEBUG=0
      - DATABASE_URL=postgresql://tabbycat:${DATABASE_PASSWORD}@postgres:5432/tabbycat
      - REDIS_URL=redis://redis:6379
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - TIME_ZONE=${TIME_ZONE}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      # SDA judges export integration (the feedbackexport worker runs here)
      - SDA_JUDGES_FEEDBACK_EXPORT_ENABLED=${SDA_JUDGES_FEEDBACK_EXPORT_ENABLED}
      - SDA_JUDGES_FEEDBACK_API_URL=${SDA_JUDGES_FEEDBACK_API_URL}
      - SDA_JUDGES_FEEDBACK_API_TOKEN=${SDA_JUDGES_FEEDBACK_API_TOKEN}
      - SDA_JUDGES_ACTIVITY_EXPORT_ENABLED=${SDA_JUDGES_ACTIVITY_EXPORT_ENABLED}
      - SDA_JUDGES_ACTIVITY_API_URL=${SDA_JUDGES_ACTIVITY_API_URL}
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:
  redisdata:
